name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check .

      - name: Typecheck
        run: python -m mypy

      - name: Test
        run: python -m coverage run -m pytest tests/hindsight -q

      - name: Coverage
        run: python -m coverage report

      - name: Verify standalone imports
        run: |
          if grep -R "from marketimmune\|import marketimmune" hindsight tests; then
            echo "MarketImmune imports are not allowed in standalone Hindsight."
            exit 1
          fi

      - name: Smoke commands
        run: |
          python -m hindsight.cli run --output-dir /tmp/hindsight-run
          python -m hindsight.cli benchmark --output-dir /tmp/hindsight-benchmark
          python -m hindsight.cli demo --output-dir /tmp/hindsight-demo
          python -m hindsight.cli pages --output-dir /tmp/hindsight-pages
          test -f /tmp/hindsight-pages/index.html
          test -f /tmp/hindsight-pages/demo/tearsheet.html

      - name: Falsification suite
        run: python -m hindsight.cli falsify --output-dir /tmp/hindsight-falsify

      - name: Demo determinism
        run: |
          python -m hindsight.cli demo --output-dir /tmp/hindsight-demo-a
          python -m hindsight.cli demo --output-dir /tmp/hindsight-demo-b
          python - <<'PY'
          import json
          from pathlib import Path

          first = json.loads(Path("/tmp/hindsight-demo-a/manifest.json").read_text())
          second = json.loads(Path("/tmp/hindsight-demo-b/manifest.json").read_text())
          first_report = json.loads(Path("/tmp/hindsight-demo-a/report.json").read_text())
          second_report = json.loads(Path("/tmp/hindsight-demo-b/report.json").read_text())
          assert first["run_id"] == second["run_id"]
          assert first["data_content_hash"] == second["data_content_hash"]
          assert (
              first_report["provenance"]["report_self_hash"]
              == second_report["provenance"]["report_self_hash"]
          )
          assert (
              Path("/tmp/hindsight-demo-a/report.json").read_bytes()
              == Path("/tmp/hindsight-demo-b/report.json").read_bytes()
          )
          assert (
              Path("/tmp/hindsight-demo-a/tearsheet.html").read_bytes()
              == Path("/tmp/hindsight-demo-b/tearsheet.html").read_bytes()
          )
          PY

  catboost-extra:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CatBoost extra
        run: python -m pip install -e ".[dev,catboost]"

      - name: CatBoost adapter tests
        run: python -m pytest tests/hindsight/test_catboost_adapter.py -q
