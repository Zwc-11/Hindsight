name: economic-research
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  native-and-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned native toolchain
        run: rustup toolchain install 1.90.0 --profile minimal --component clippy --component rustfmt
      - name: Install Python integration dependencies
        run: python -m pip install -e ".[dev,economic]"
      - name: Install dashboard test dependencies
        run: |
          npm --prefix ui/economic ci --ignore-scripts
          cd ui/economic
          npx playwright install --with-deps chromium
      - name: Verify existing and native paths
        env:
          PYTHON: python
          HINDSIGHT_BROWSER_TESTS: "1"
        run: bash scripts/verify-economic.sh reports/ci-economic
      - name: Retain test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: economic-verification
          path: reports/ci-economic
