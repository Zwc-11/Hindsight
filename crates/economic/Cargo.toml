[package]
name = "hindsight-economic"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "MIT"
build = "build.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
cxx = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

[build-dependencies]
cxx-build = "1.0"
